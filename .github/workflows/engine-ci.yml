name: Engine CI

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/engine-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and test narrative engine
        run: gradle :engine:test --stacktrace
